name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 校验 SKILL.md 结构
        run: python .github/validate_skills.py

      - name: 脚本语法检查
        run: python -m compileall -q msstore-offline/scripts
